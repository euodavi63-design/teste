<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Menu VR - Hand Tracking</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
    width: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  video { display: none; }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #status {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.5);
    padding: 5px 9px;
    border-radius: 6px;
    z-index: 10;
  }
  #startOverlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.88);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 20;
    padding: 24px;
    box-sizing: border-box;
  }
  #startOverlay button {
    margin-top: 18px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    background: #3C8CE6;
    color: #fff;
  }
  #startOverlay p { font-size: 14px; opacity: 0.8; max-width: 320px; }
</style>
</head>
<body>

<div id="container">
  <video id="webcam" playsinline></video>
  <canvas id="output"></canvas>
  <div id="status">Iniciando câmera...</div>
  <div id="startOverlay">
    <h2>Menu VR</h2>
    <p>Segure o celular olhando pra frente e toque em começar.<br>
       Esse ponto vira o "centro" do menu flutuante (3DoF).</p>
    <button id="startBtn">Começar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
const videoElement = document.getElementById('webcam');
const canvasElement = document.getElementById('output');
const canvasCtx = canvasElement.getContext('2d');
const statusEl = document.getElementById('status');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');

function resizeCanvas() {
  canvasElement.width = window.innerWidth;
  canvasElement.height = window.innerHeight;
  layoutMenu();
}
window.addEventListener('resize', resizeCanvas);

// ---------------------------------------------------------
// MENU: barra flutuante estilo Quest. Relógio + wifi/bateria
// (dados reais do celular, quando o navegador permite) +
// sininho de notificações (decorativo - navegadores não têm
// acesso às notificações reais do sistema, só das próprias
// páginas web) + ícones de app coloridos (Loja, Câmera,
// Config) + grade "todos os apps".
// ---------------------------------------------------------
let buttons = [];      // itens clicáveis (hand tracking detecta hover/pinça)
let statusIcons = [];  // ícones só informativos (wifi/bateria), não clicáveis
let pill = { x: 0, y: 0, w: 0, h: 0, sepX: 0 };
let floatOffset = 0;
let batteryLevel = null; // 0 a 1, preenchido se o navegador suportar

if ('getBattery' in navigator) {
  navigator.getBattery().then((bat) => {
    batteryLevel = bat.level;
    bat.addEventListener('levelchange', () => { batteryLevel = bat.level; });
  }).catch(() => {});
}

function layoutMenu() {
  buttons = [];
  statusIcons = [];

  const pillH = canvasElement.height * 0.068;
  const iconR = pillH * 0.24;   // ícones utilitários (wifi, bateria) - menores, mais discretos
  const appR = pillH * 0.42;    // ícones de app - bem maiores, quase preenchendo a barra
  const pad = pillH * 0.55;
  const clockW = pillH * 1.5;
  const gapUtil = iconR * 2.0;
  const gapApp = appR * 1.6;   // bem mais separados agora

  const centerYRel = 0; // preenchido depois de saber pillY

  let cursor = pad;
  cursor += clockW;

  // --- wifi e bateria (só informativo) ---
  const wifiX = cursor + iconR;
  cursor += iconR * 2.1;
  const battX = cursor + iconR;
  cursor += iconR * 2.4;

  const sepXRel = cursor;
  cursor += pillH * 0.5;

  // --- apps coloridos ---
  const apps = [
    { id: 'browser',  glyph: 'globe',    color: '#3C8CE6' },
    { id: 'loja',     glyph: 'store',    color: '#E6821E' },
    { id: 'share',    glyph: 'share',    color: '#8C5CE6' },
    { id: 'config',   glyph: 'settings', color: '#7A7F8A' },
    { id: 'todos',    glyph: 'grid',     color: '#3A3F4A' },
  ];

  const appPositions = [];
  apps.forEach((a) => {
    appPositions.push(cursor + appR);
    cursor += appR * 2 + gapApp;
  });

  cursor += pad - gapApp;

  const pillW = cursor;
  const pillX = canvasElement.width * 0.5 - pillW * 0.5;
  const pillY = canvasElement.height * 0.44 - pillH / 2;
  const centerY = pillY + pillH / 2;

  pill = { x: pillX, y: pillY, w: pillW, h: pillH, sepX: pillX + sepXRel };

  statusIcons = [
    { glyph: 'wifi', x: pillX + wifiX, y: centerY, r: iconR * 0.85 },
    { glyph: 'battery', x: pillX + battX, y: centerY, r: iconR * 0.85 },
  ];

  apps.forEach((a, i) => {
    buttons.push({
      ...a, x: pillX + appPositions[i], y: centerY, radius: appR,
      style: 'app',
      rotation: 0, hoverProgress: 0, scale: 1, lastTriggerTime: 0
    });
  });
}

// ---------------------------------------------------------
// 3DoF: usa o giroscópio do celular pra saber a rotação da
// cabeça e mover o menu na direção OPOSTA, dando a sensação
// de que ele fica parado num ponto fixo do espaço (igual o
// menu do Meta Quest) em vez de grudado na tela.
// ---------------------------------------------------------
let orientationEnabled = false;
let baseAlpha = null, baseBeta = null;
let targetWorldOffsetX = 0, targetWorldOffsetY = 0; // valor bruto (ruidoso) do sensor
let worldOffsetX = 0, worldOffsetY = 0;              // valor suavizado, usado pra desenhar
const FOV_DEG_X = 90; // menos sensível = menos "nervoso"
const FOV_DEG_Y = 70;
const ORIENTATION_SMOOTHING = 0.85; // 0 = sem suavização, mais perto de 1 = mais suave/lento

function angleDiff(a, b) {
  let d = a - b;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return d;
}

function handleOrientation(e) {
  if (e.alpha === null || e.beta === null) return;
  if (baseAlpha === null) {
    baseAlpha = e.alpha;
    baseBeta = e.beta;
  }
  const deltaYaw = angleDiff(e.alpha, baseAlpha);
  // limita o pitch pra evitar comportamento maluco perto de 90°
  // (gimbal lock), quando o celular fica quase na vertical
  const deltaPitch = Math.max(-80, Math.min(80, e.beta - baseBeta));

  targetWorldOffsetX = -(deltaYaw / FOV_DEG_X) * canvasElement.width;
  targetWorldOffsetY = (deltaPitch / FOV_DEG_Y) * canvasElement.height;
}

function enableOrientation() {
  if (orientationEnabled) return;
  orientationEnabled = true;
  baseAlpha = null;
  baseBeta = null;

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then((state) => {
        if (state === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
        }
      })
      .catch(() => {});
  } else if ('DeviceOrientationEvent' in window) {
    window.addEventListener('deviceorientation', handleOrientation);
  }
}

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

const SMOOTHING = 0.5;
let smoothedHands = [];

function lerp(a, b, t) { return a + (b - a) * t; }

function smoothLandmarks(rawHands) {
  if (smoothedHands.length !== rawHands.length) {
    smoothedHands = rawHands.map(hand => hand.map(p => ({ ...p })));
    return smoothedHands;
  }
  for (let h = 0; h < rawHands.length; h++) {
    for (let i = 0; i < rawHands[h].length; i++) {
      const raw = rawHands[h][i];
      const smooth = smoothedHands[h][i];
      smooth.x = lerp(raw.x, smooth.x, SMOOTHING);
      smooth.y = lerp(raw.y, smooth.y, SMOOTHING);
    }
  }
  return smoothedHands;
}

function drawHandSkeleton(landmarks) {
  canvasCtx.strokeStyle = 'rgba(0,255,136,0.6)';
  canvasCtx.lineWidth = 3;
  for (const [start, end] of HAND_CONNECTIONS) {
    const p1 = landmarks[start];
    const p2 = landmarks[end];
    canvasCtx.beginPath();
    canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
    canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
    canvasCtx.stroke();
  }
}

function drawMenuAndCheckHover(fingerX, fingerY, isPinching, dt) {
  for (const btn of buttons) {
    const drawX = btn.x + worldOffsetX;
    const drawY = btn.y + floatOffset + worldOffsetY;
    const dx = fingerX - drawX;
    const dy = fingerY - drawY;
    const dist = Math.hypot(dx, dy);
    const isHover = fingerX !== null && dist < btn.radius * 1.3;

    if (isHover) {
      btn.hoverProgress = Math.min(1, btn.hoverProgress + dt * 1.8);
    } else {
      btn.hoverProgress = Math.max(0, btn.hoverProgress - dt * 3);
    }

    const targetScale = isHover ? 1.15 : 1;
    btn.scale = lerp(targetScale, btn.scale, Math.pow(0.001, dt));

    const now = performance.now();
    if (isHover && isPinching && now - btn.lastTriggerTime > 700) {
      btn.lastTriggerTime = now;
      onMenuButtonClick(btn);
    }

    drawButton(btn, isHover, drawX, drawY);
  }
}

function drawDockPanel() {
  const x = pill.x + worldOffsetX;
  const y = pill.y + floatOffset + worldOffsetY;
  canvasCtx.save();
  canvasCtx.shadowColor = 'rgba(0,0,0,0.5)';
  canvasCtx.shadowBlur = 24;
  canvasCtx.shadowOffsetY = 10;
  canvasCtx.beginPath();
  canvasCtx.roundRect
    ? canvasCtx.roundRect(x, y, pill.w, pill.h, pill.h / 2)
    : canvasCtx.rect(x, y, pill.w, pill.h);
  canvasCtx.fillStyle = 'rgba(24,30,40,0.82)';
  canvasCtx.fill();
  canvasCtx.shadowBlur = 0;
  canvasCtx.shadowOffsetY = 0;
  canvasCtx.strokeStyle = 'rgba(255,255,255,0.10)';
  canvasCtx.lineWidth = 1;
  canvasCtx.stroke();

  const sepX = pill.sepX + worldOffsetX;
  canvasCtx.beginPath();
  canvasCtx.moveTo(sepX, y + pill.h * 0.22);
  canvasCtx.lineTo(sepX, y + pill.h * 0.78);
  canvasCtx.strokeStyle = 'rgba(255,255,255,0.15)';
  canvasCtx.lineWidth = 1.5;
  canvasCtx.stroke();
  canvasCtx.restore();
}

function drawClock() {
  // Usa o fuso horário que o próprio celular já detecta sozinho
  // (baseado em localização/rede) - assim o horário se atualiza
  // automaticamente se a pessoa mudar de região/país.
  const timeStr = new Date().toLocaleTimeString('pt-BR', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
  const x = pill.x + pill.h * 0.85 + worldOffsetX;
  const y = pill.y + pill.h / 2 + floatOffset + worldOffsetY;

  canvasCtx.save();
  canvasCtx.font = `bold ${pill.h * 0.26}px sans-serif`;
  canvasCtx.textAlign = 'center';
  canvasCtx.textBaseline = 'middle';
  canvasCtx.fillStyle = '#FFFFFF';
  canvasCtx.fillText(timeStr, x, y);
  canvasCtx.restore();
}

// Ícones só informativos (wifi / bateria) - não reagem à mão,
// mostram dado real quando o navegador permite acesso.
function drawStatusIcons() {
  for (const icon of statusIcons) {
    const x = icon.x + worldOffsetX;
    const y = icon.y + floatOffset + worldOffsetY;
    canvasCtx.save();
    canvasCtx.translate(x, y);
    canvasCtx.globalAlpha = 0.85;

    if (icon.glyph === 'wifi') {
      drawWifiGlyph(icon.r, navigator.onLine);
    } else if (icon.glyph === 'battery') {
      drawBatteryGlyph(icon.r, batteryLevel);
    }
    canvasCtx.restore();
  }
}

function drawWifiGlyph(s, online) {
  canvasCtx.strokeStyle = online ? '#FFFFFF' : 'rgba(255,255,255,0.35)';
  canvasCtx.lineWidth = s * 0.16;
  canvasCtx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const r = s * (0.4 + i * 0.3);
    canvasCtx.beginPath();
    canvasCtx.arc(0, s * 0.35, r, Math.PI * 1.25, Math.PI * 1.75);
    canvasCtx.stroke();
  }
  canvasCtx.beginPath();
  canvasCtx.arc(0, s * 0.35, s * 0.08, 0, 2 * Math.PI);
  canvasCtx.fillStyle = canvasCtx.strokeStyle;
  canvasCtx.fill();
}

function drawBatteryGlyph(s, level) {
  const w = s * 1.5, h = s * 0.85;
  canvasCtx.strokeStyle = '#FFFFFF';
  canvasCtx.lineWidth = s * 0.12;
  canvasCtx.beginPath();
  canvasCtx.roundRect
    ? canvasCtx.roundRect(-w/2, -h/2, w, h, s * 0.12)
    : canvasCtx.rect(-w/2, -h/2, w, h);
  canvasCtx.stroke();
  canvasCtx.fillStyle = '#FFFFFF';
  canvasCtx.fillRect(w/2 + s*0.06, -h*0.18, s*0.1, h*0.36);

  const lvl = level !== null ? level : 1;
  const innerW = (w - s*0.28) * lvl;
  canvasCtx.fillRect(-w/2 + s*0.14, -h/2 + s*0.14, innerW, h - s*0.28);

  if (level !== null) {
    canvasCtx.font = `${s*0.62}px sans-serif`;
    canvasCtx.textAlign = 'left';
    canvasCtx.textBaseline = 'middle';
    canvasCtx.fillStyle = '#FFFFFF';
    canvasCtx.fillText(`${Math.round(level*100)}%`, w/2 + s*0.35, 0);
  }
}

function drawButton(btn, isHover, drawX, drawY) {
  if (btn.style === 'utility') {
    drawUtilityButton(btn, isHover, drawX, drawY);
  } else {
    drawAppButton(btn, isHover, drawX, drawY);
  }
}

function drawUtilityButton(btn, isHover, drawX, drawY) {
  const r = btn.radius * btn.scale;

  canvasCtx.save();
  canvasCtx.translate(drawX, drawY);

  if (isHover) {
    canvasCtx.beginPath();
    canvasCtx.arc(0, 0, r * 1.7, 0, 2 * Math.PI);
    canvasCtx.fillStyle = 'rgba(255,255,255,0.14)';
    canvasCtx.fill();
  }

  if (btn.hoverProgress > 0.01) {
    canvasCtx.beginPath();
    canvasCtx.arc(0, 0, r * 1.9, -Math.PI/2, -Math.PI/2 + btn.hoverProgress * 2 * Math.PI);
    canvasCtx.strokeStyle = `rgba(255,255,255,${0.5 + btn.hoverProgress * 0.5})`;
    canvasCtx.lineWidth = 2.5;
    canvasCtx.lineCap = 'round';
    canvasCtx.stroke();
  }

  canvasCtx.globalAlpha = 0.85 + btn.hoverProgress * 0.15;
  drawGlyph(btn.glyph, r * 0.95);
  canvasCtx.globalAlpha = 1;

  // bolinha de notificação (decorativa - ver aviso sobre limitação no chat)
  if (btn.hasBadge) {
    canvasCtx.beginPath();
    canvasCtx.arc(r * 0.65, -r * 0.65, r * 0.32, 0, 2 * Math.PI);
    canvasCtx.fillStyle = '#FF4040';
    canvasCtx.fill();
  }

  canvasCtx.restore();
}

function drawAppButton(btn, isHover, drawX, drawY) {
  const r = btn.radius * btn.scale;

  canvasCtx.save();
  canvasCtx.translate(drawX, drawY);
  canvasCtx.rotate(btn.rotation || 0);

  canvasCtx.shadowColor = 'rgba(0,0,0,0.45)';
  canvasCtx.shadowBlur = 14;
  canvasCtx.shadowOffsetY = 6;

  if (isHover) {
    canvasCtx.shadowColor = btn.color;
    canvasCtx.shadowBlur = 28;
    canvasCtx.shadowOffsetY = 0;
  }

  const grad = canvasCtx.createLinearGradient(0, -r, 0, r);
  grad.addColorStop(0, shadeColor(btn.color, 12));
  grad.addColorStop(1, shadeColor(btn.color, -30));

  canvasCtx.beginPath();
  canvasCtx.arc(0, 0, r, 0, 2 * Math.PI);
  canvasCtx.fillStyle = grad;
  canvasCtx.fill();

  canvasCtx.shadowBlur = 0;
  canvasCtx.shadowOffsetY = 0;

  if (btn.hoverProgress > 0.01) {
    canvasCtx.beginPath();
    canvasCtx.arc(0, 0, r + 9, -Math.PI/2, -Math.PI/2 + btn.hoverProgress * 2 * Math.PI);
    canvasCtx.strokeStyle = `rgba(255,255,255,${0.5 + btn.hoverProgress * 0.5})`;
    canvasCtx.lineWidth = 3.5;
    canvasCtx.lineCap = 'round';
    canvasCtx.stroke();
  }

  drawGlyph(btn.glyph, r * 0.5);
  canvasCtx.restore();
}

function drawGlyph(type, s) {
  canvasCtx.strokeStyle = '#FFFFFF';
  canvasCtx.fillStyle = '#FFFFFF';
  canvasCtx.lineWidth = s * 0.14;
  canvasCtx.lineCap = 'round';
  canvasCtx.lineJoin = 'round';

  switch (type) {
    case 'grid': {
      const g = s * 0.55;
      const o = s * 0.62;
      [[-o,-o],[o,-o],[-o,o],[o,o]].forEach(([cx,cy]) => {
        canvasCtx.beginPath();
        canvasCtx.roundRect
          ? canvasCtx.roundRect(cx-g/2, cy-g/2, g, g, g*0.25)
          : canvasCtx.rect(cx-g/2, cy-g/2, g, g);
        canvasCtx.fill();
      });
      break;
    }
    case 'bell': {
      canvasCtx.beginPath();
      canvasCtx.arc(0, -s*0.05, s*0.65, Math.PI, 2*Math.PI);
      canvasCtx.lineTo(s*0.65, s*0.35);
      canvasCtx.lineTo(-s*0.65, s*0.35);
      canvasCtx.closePath();
      canvasCtx.fill();
      canvasCtx.beginPath();
      canvasCtx.arc(0, s*0.55, s*0.18, 0, 2*Math.PI);
      canvasCtx.fill();
      break;
    }
    case 'settings': {
      const teeth = 8;
      const toothW = s * 0.32;
      const toothH = s * 0.28;
      const innerR = s * 0.48;
      for (let i = 0; i < teeth; i++) {
        const a = (i / teeth) * Math.PI * 2;
        canvasCtx.save();
        canvasCtx.rotate(a);
        canvasCtx.beginPath();
        canvasCtx.roundRect
          ? canvasCtx.roundRect(-toothW/2, -innerR - toothH, toothW, toothH, toothW*0.25)
          : canvasCtx.rect(-toothW/2, -innerR - toothH, toothW, toothH);
        canvasCtx.fill();
        canvasCtx.restore();
      }
      canvasCtx.beginPath();
      canvasCtx.arc(0, 0, innerR, 0, 2*Math.PI);
      canvasCtx.fill();
      canvasCtx.beginPath();
      canvasCtx.arc(0, 0, s*0.22, 0, 2*Math.PI);
      canvasCtx.fillStyle = 'rgba(0,0,0,0.35)';
      canvasCtx.fill();
      break;
    }
    case 'globe': {
      canvasCtx.beginPath();
      canvasCtx.arc(0, 0, s*0.8, 0, 2*Math.PI);
      canvasCtx.stroke();
      canvasCtx.beginPath();
      canvasCtx.ellipse(0, 0, s*0.35, s*0.8, 0, 0, 2*Math.PI);
      canvasCtx.stroke();
      canvasCtx.beginPath();
      canvasCtx.moveTo(-s*0.8, 0);
      canvasCtx.lineTo(s*0.8, 0);
      canvasCtx.stroke();
      canvasCtx.beginPath();
      canvasCtx.moveTo(-s*0.65, -s*0.42);
      canvasCtx.lineTo(s*0.65, -s*0.42);
      canvasCtx.moveTo(-s*0.65, s*0.42);
      canvasCtx.lineTo(s*0.65, s*0.42);
      canvasCtx.stroke();
      break;
    }
    case 'share': {
      canvasCtx.beginPath();
      canvasCtx.arc(-s*0.7, 0, s*0.16, 0, 2*Math.PI);
      canvasCtx.fill();
      canvasCtx.beginPath();
      canvasCtx.arc(s*0.7, -s*0.55, s*0.16, 0, 2*Math.PI);
      canvasCtx.fill();
      canvasCtx.beginPath();
      canvasCtx.arc(s*0.7, s*0.55, s*0.16, 0, 2*Math.PI);
      canvasCtx.fill();
      canvasCtx.beginPath();
      canvasCtx.moveTo(-s*0.65, 0);
      canvasCtx.lineTo(s*0.63, -s*0.5);
      canvasCtx.moveTo(-s*0.65, 0);
      canvasCtx.lineTo(s*0.63, s*0.5);
      canvasCtx.stroke();
      break;
    }
    case 'store': {
      canvasCtx.beginPath();
      canvasCtx.moveTo(-s*0.9, -s*0.15);
      canvasCtx.lineTo(-s*0.6, -s*0.75);
      canvasCtx.lineTo(s*0.6, -s*0.75);
      canvasCtx.lineTo(s*0.9, -s*0.15);
      canvasCtx.closePath();
      canvasCtx.fill();
      canvasCtx.beginPath();
      canvasCtx.roundRect
        ? canvasCtx.roundRect(-s*0.7, -s*0.15, s*1.4, s*0.9, s*0.08)
        : canvasCtx.rect(-s*0.7, -s*0.15, s*1.4, s*0.9);
      canvasCtx.stroke();
      canvasCtx.beginPath();
      canvasCtx.roundRect
        ? canvasCtx.roundRect(-s*0.22, s*0.2, s*0.44, s*0.55, s*0.06)
        : canvasCtx.rect(-s*0.22, s*0.2, s*0.44, s*0.55);
      canvasCtx.fill();
      break;
    }
    case 'camera': {
      canvasCtx.beginPath();
      canvasCtx.roundRect
        ? canvasCtx.roundRect(-s, -s*0.55, s*2, s*1.25, s*0.22)
        : canvasCtx.rect(-s, -s*0.55, s*2, s*1.25);
      canvasCtx.stroke();
      canvasCtx.beginPath();
      canvasCtx.moveTo(-s*0.35, -s*0.55);
      canvasCtx.lineTo(-s*0.15, -s*0.9);
      canvasCtx.lineTo(s*0.15, -s*0.9);
      canvasCtx.lineTo(s*0.35, -s*0.55);
      canvasCtx.stroke();
      canvasCtx.beginPath();
      canvasCtx.arc(0, s*0.08, s*0.38, 0, 2*Math.PI);
      canvasCtx.stroke();
      break;
    }
    default: {
      canvasCtx.beginPath();
      canvasCtx.arc(0, 0, s*0.6, 0, 2*Math.PI);
      canvasCtx.fill();
    }
  }
}

function shadeColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.min(255, Math.max(0, r));
  g = Math.min(255, Math.max(0, g));
  b = Math.min(255, Math.max(0, b));
  return `rgb(${r},${g},${b})`;
}

function onMenuButtonClick(btn) {
  statusEl.textContent = `Botão clicado: ${btn.id}`;
  // >>> Edite aqui o que cada botão faz <<<
}

function drawCursor(x, y, isPinching) {
  canvasCtx.beginPath();
  canvasCtx.arc(x, y, isPinching ? 14 : 10, 0, 2 * Math.PI);
  canvasCtx.strokeStyle = isPinching ? '#00FFFF' : '#FFFFFF';
  canvasCtx.lineWidth = 3;
  canvasCtx.stroke();
  if (isPinching) {
    canvasCtx.beginPath();
    canvasCtx.arc(x, y, 5, 0, 2 * Math.PI);
    canvasCtx.fillStyle = '#00FFFF';
    canvasCtx.fill();
  }
}

let latestVideoFrame = null;
let latestResults = [];
let lastLoopTime = performance.now();

function onResults(results) {
  latestVideoFrame = results.image;
  latestResults = results.multiHandLandmarks || [];
}

function renderLoop() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastLoopTime) / 1000);
  lastLoopTime = now;

  if (latestVideoFrame) {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.drawImage(latestVideoFrame, 0, 0, canvasElement.width, canvasElement.height);

    let fingerX = null, fingerY = null, isPinching = false;

    if (latestResults.length > 0) {
      const smoothed = smoothLandmarks(latestResults);
      const hand = smoothed[0];

      drawHandSkeleton(hand);

      const indexTip = hand[8];
      const thumbTip = hand[4];
      fingerX = indexTip.x * canvasElement.width;
      fingerY = indexTip.y * canvasElement.height;

      const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
      isPinching = pinchDist < 0.055;

      statusEl.textContent = isPinching ? 'Pinça ativa' : 'Aponte o indicador pro botão e feche a pinça';
    } else {
      smoothedHands = [];
      statusEl.textContent = 'Nenhuma mão detectada';
    }

    const floatAmplitude = pill.h * 0.10;
    floatOffset = Math.sin(now * 0.0012) * floatAmplitude;

    // Suaviza o giroscópio (que é naturalmente ruidoso) antes de usar
    worldOffsetX = lerp(targetWorldOffsetX, worldOffsetX, Math.pow(ORIENTATION_SMOOTHING, dt));
    worldOffsetY = lerp(targetWorldOffsetY, worldOffsetY, Math.pow(ORIENTATION_SMOOTHING, dt));

    drawDockPanel();
    drawClock();
    drawStatusIcons();
    drawMenuAndCheckHover(fingerX, fingerY, isPinching, dt);

    if (fingerX !== null) {
      drawCursor(fingerX, fingerY, isPinching);
    }

    canvasCtx.restore();
  }
  requestAnimationFrame(renderLoop);
}

resizeCanvas();
requestAnimationFrame(renderLoop);

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 0,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.5
});

hands.onResults(onResults);

const camera = new Camera(videoElement, {
  onFrame: async () => { await hands.send({ image: videoElement }); },
  width: 640,
  height: 480,
  facingMode: 'environment'
});

startBtn.addEventListener('click', () => {
  enableOrientation(); // precisa ser dentro de um toque do usuário (obrigatório no iOS)
  camera.start()
    .then(() => { statusEl.textContent = 'Câmera iniciada.'; })
    .catch((err) => { statusEl.textContent = 'Erro na câmera: ' + err.message; });
  startOverlay.style.display = 'none';
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
