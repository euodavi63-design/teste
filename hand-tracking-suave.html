<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hand Tracking Suave - VR Box</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }
  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  video {
    display: none;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #status {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #0f0;
    font-family: monospace;
    font-size: 13px;
    background: rgba(0,0,0,0.5);
    padding: 6px 10px;
    border-radius: 6px;
    z-index: 10;
    max-width: 90%;
  }
</style>
</head>
<body>

<div id="container">
  <video id="webcam" playsinline></video>
  <canvas id="output"></canvas>
  <div id="status">Iniciando câmera...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
const videoElement = document.getElementById('webcam');
const canvasElement = document.getElementById('output');
const canvasCtx = canvasElement.getContext('2d');
const statusEl = document.getElementById('status');

function resizeCanvas() {
  canvasElement.width = window.innerWidth;
  canvasElement.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

// ---------------------------------------------------------
// SUAVIZAÇÃO: guarda a última posição de cada mão e "persegue"
// o alvo novo em vez de saltar direto pra ele. Isso mata o
// tremor sem deixar o movimento com atraso perceptível.
// ---------------------------------------------------------
const SMOOTHING = 0.55; // 0 = sem suavização (bruto/tremido), 1 = travado. 0.5-0.6 é o ponto ideal.
let smoothedHands = []; // array de arrays de {x,y,z}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function smoothLandmarks(rawHands) {
  if (smoothedHands.length !== rawHands.length) {
    smoothedHands = rawHands.map(hand => hand.map(p => ({ ...p })));
    return smoothedHands;
  }
  for (let h = 0; h < rawHands.length; h++) {
    for (let i = 0; i < rawHands[h].length; i++) {
      const raw = rawHands[h][i];
      const smooth = smoothedHands[h][i];
      smooth.x = lerp(raw.x, smooth.x, SMOOTHING);
      smooth.y = lerp(raw.y, smooth.y, SMOOTHING);
      smooth.z = lerp(raw.z, smooth.z, SMOOTHING);
    }
  }
  return smoothedHands;
}

function drawHand(landmarks) {
  canvasCtx.strokeStyle = '#00FF88';
  canvasCtx.lineWidth = 4;
  canvasCtx.lineCap = 'round';
  for (const [start, end] of HAND_CONNECTIONS) {
    const p1 = landmarks[start];
    const p2 = landmarks[end];
    canvasCtx.beginPath();
    canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
    canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
    canvasCtx.stroke();
  }

  canvasCtx.fillStyle = '#FF3355';
  for (const point of landmarks) {
    canvasCtx.beginPath();
    canvasCtx.arc(point.x * canvasElement.width, point.y * canvasElement.height, 6, 0, 2 * Math.PI);
    canvasCtx.fill();
  }

  const thumbTip = landmarks[4];
  const indexTip = landmarks[8];
  const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
  if (dist < 0.05) {
    canvasCtx.fillStyle = '#00FFFF';
    canvasCtx.font = 'bold 28px sans-serif';
    canvasCtx.fillText('PINÇA! (clique)', 20, 60);
  }
}

let latestVideoFrame = null;
let latestResults = [];
let lastFrameTime = performance.now();

function onResults(results) {
  latestVideoFrame = results.image;
  latestResults = results.multiHandLandmarks || [];
  const now = performance.now();
  const fps = Math.round(1000 / (now - lastFrameTime));
  lastFrameTime = now;
  statusEl.textContent = latestResults.length > 0
    ? `Mãos: ${latestResults.length} | ~${fps} fps do modelo`
    : `Nenhuma mão detectada | ~${fps} fps do modelo`;
}

// ---------------------------------------------------------
// LOOP DE RENDER SEPARADO: desenha na tela o mais rápido que
// o celular aguentar, mesmo que o modelo de IA rode mais
// devagar. É isso que faz o movimento parecer "líquido" em
// vez de travado no fps do modelo.
// ---------------------------------------------------------
function renderLoop() {
  if (latestVideoFrame) {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.drawImage(latestVideoFrame, 0, 0, canvasElement.width, canvasElement.height);

    if (latestResults.length > 0) {
      const smoothed = smoothLandmarks(latestResults);
      for (const hand of smoothed) {
        drawHand(hand);
      }
    } else {
      smoothedHands = [];
    }
    canvasCtx.restore();
  }
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 0,       // 0 = mais rápido (leve), 1 = mais preciso porém mais lento
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.5
});

hands.onResults(onResults);

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await hands.send({ image: videoElement });
  },
  width: 640,   // resolução menor = modelo processa mais rápido = tracking mais responsivo
  height: 480,
  facingMode: 'environment'
});

camera.start()
  .then(() => { statusEl.textContent = 'Câmera iniciada. Aponte a mão pra câmera.'; })
  .catch((err) => { statusEl.textContent = 'Erro na câmera: ' + err.message; });
</script>

</body>
</html>
